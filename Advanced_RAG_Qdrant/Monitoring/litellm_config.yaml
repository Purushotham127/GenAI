model_list:
  - model_name: qwen3:4b
    litellm_params:
      model: ollama/qwen3:4b
      api_base: http://127.0.0.1:11434

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  require_auth_for_metrics_endpoint: true

litellm_settings:
  callbacks:
    - prometheus
    - Monitoring.sqlite_metrics.proxy_handler_instance
  request_timeout: 600
  num_retries: 0
